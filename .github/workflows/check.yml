# One workflow, one command.
#
# `npm run check` validates every plugin by the app's own manifest rules,
# self-tests those rules against fixtures that break them, runs the language
# gate, and runs the tool package's own suite.
#
# The tool is the repository's first thing with a dependency — TypeScript, and
# nothing else — so there is one `npm ci` for it and no more. Nothing here
# builds an image or starts a container: the Actions minutes on this account
# are shared with several other repositories, and this stays under a minute.
#
# NO TEST IN THIS WORKFLOW MAKES A NETWORK CALL. The tool's suite carries a
# test that scans its own source and its built output for every way a Node
# program reaches the network, and that scan is red-proved against a fixture
# that uses each of them.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/kiso-film/package-lock.json
      - run: npm ci --prefix tools/kiso-film
      - run: npm run check
