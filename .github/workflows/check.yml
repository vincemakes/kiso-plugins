# One workflow, one command.
#
# `npm run check` is pure Node with no dependencies: it validates every plugin
# by the app's own manifest rules, self-tests those rules against fixtures
# that break them, and runs the language gate. There is nothing to build and
# nothing to containerise here, and the Actions minutes on this account are
# shared with several other repositories — so this stays under a minute and
# never grows a docker step.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
